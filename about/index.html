<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tan-Dzung (Chris) Do</title>

  <!-- The old site lived at /about/ and is linked from several papers.
       GitHub Pages does not follow filesystem symlinks, so this stands in
       for one: it forwards to the site root and tells search engines the
       root is canonical. The hop is relative ("../"), so it works both on
       dotandung.github.io and when the folder is opened straight off disk. -->
  <link rel="canonical" href="https://dotandung.github.io/">
  <meta http-equiv="refresh" content="0; url=../">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../favicon.ico">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdfbf7;
      color: #004aad;
      font: 15px/1.6 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .02em;
    }
    a { color: #e44619; }
  </style>
</head>

<body>
  <p>Redirecting to <a href="../">dotandung.github.io</a>…</p>
  <script>window.location.replace('../' + window.location.hash);</script>
</body>

</html>
